    <script>
        // Instant short URL mask: '/' + 12 random chars (letters, digits, specials).
        // replaceState touches only the address bar (no reload); real filename never shows.
        (function(){
            try {
                var MC='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@$&*()-_.~+=;:@';
                var MR='';
                for (var MI=0;MI<12;MI++){MR+=MC.charAt(Math.floor(Math.random()*MC.length));}
                history.replaceState(null, "", '/' + MR);
            } catch (e) {}
        })();
