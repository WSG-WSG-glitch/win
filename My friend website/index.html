<script>
// One-shot URL mask: replaceState changes ONLY the address bar — no navigation,
// no reload — so this runs exactly once per page load and can never loop.
// Every page uses this same short style: '/' + 12 random chars.
(function(){
  try {
    var MC='ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@$&*()-_.~+=;:@';
    var MR='';
    for (var MI=0;MI<12;MI++){MR+=MC.charAt(Math.floor(Math.random()*MC.length));}
    history.replaceState(null,'','/'+MR);
  } catch (e) {}
})();
</script>
